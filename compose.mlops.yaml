# Overlay: docker compose -f compose.yaml -f compose.mlops.yaml up -d --build
# Only serving feedback uses MinIO; the saved model is bundled in the image.
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  feedback-storage-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: dice-viewer-demo:e33njkwb56yiiaa2
    command: ["python", "-m", "dice_viewer.bootstrap"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      DICE_IMAGE_BUCKET: dice-feedback
    depends_on:
      minio:
        condition: service_started
    restart: "no"
  dice-service:
    environment:
      DICE_STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      DICE_IMAGE_BUCKET: dice-feedback
    depends_on:
      feedback-storage-init:
        condition: service_completed_successfully
volumes:
  minio-data:
