[project]
name = "dice-viewer-mlops"
version = "0.1.0"
description = "Academic RPG die recognition service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "bentoml>=1.4,<2",
  "boto3>=1.35,<2",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "prometheus-client>=0.21,<1",
  "pydantic>=2,<3",
  "python-multipart>=0.0.20,<1",
  "safetensors>=0.5,<1",
  "starlette>=0.40,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "ultralytics>=8.3,<9",
]

[project.scripts]
dice-deploy = "dice_viewer.deployment:main"
dice-release = "dice_viewer.release:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dice_viewer"]

[tool.bentoml.build]
service = "service:DiceService"
include = ["service.py", "src/dice_viewer/**/*.py"]

[tool.bentoml.build.python]
extra_index_url = ["https://download.pytorch.org/whl/cu126"]

[tool.bentoml.build.docker]
python_version = "3.11"
system_packages = ["libgl1", "libglib2.0-0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.uv]
required-version = "==0.12.23"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
