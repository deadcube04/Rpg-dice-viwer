[project]
name = "dice-viewer-mlops"
version = "0.1.0"
description = "Academic RPG die recognition service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "bentoml==1.4.39",
  "boto3==1.43.106",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "safetensors==0.8.0",
  "starlette==1.7.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ultralytics==8.4.173",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dice_viewer"]

[tool.bentoml.build]
service = "recognition_service:DiceRecognitionService"
include = ["recognition_service.py", "src/dice_viewer/**/*.py"]

[tool.bentoml.build.python]
extra_index_url = ["https://download.pytorch.org/whl/cu126"]

[tool.bentoml.build.docker]
python_version = "3.11"
system_packages = ["libgl1", "libglib2.0-0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.uv]
required-version = "==0.12.23"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
