name: dice-viewer-demo
services:
  dice-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: dice-viewer-demo:e33njkwb56yiiaa2
    environment:
      DICE_MODEL_TAG: dice_bundle:e33njkwb56yiiaa2
      DICE_STORAGE_BACKEND: local
      DICE_SQLITE_PATH: /state/feedback.db
      DICE_LOCAL_IMAGE_DIR: /state/images
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - demo-state:/state
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-m", "dice_viewer.deployment", "healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s
volumes:
  demo-state:
